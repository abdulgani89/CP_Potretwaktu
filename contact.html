        <section class="py-5 mt-5">
        <div class="container py-5">
            <div class="row g-5">
                <div class="col-md-6" data-aos="fade-right">
                    <h2 class="display-5 mb-4 section-title text-start">Hubungi Kami</h2>
                    <p class="lead text-muted mb-4">Siap membantu mewujudkan konsep fotografi impian Anda.</p>
                    
                    <div class="mb-4">
                        <h5 class="fw-bold mb-2">WhatsApp</h5>
                        <p><a href="https://wa.me/62812345678" class="text-decoration-none">+62 812 345 678</a></p>
                    </div>
                    
                    <div class="mb-4">
                        <h5 class="fw-bold mb-2">Email</h5>
                        <p><a href="mailto:info@potretwaktu.com" class="text-decoration-none">info@potretwaktu.com</a></p>
                    </div>
                    
                    <div class="mb-4">
                        <h5 class="fw-bold mb-2">Lokasi</h5>
                        <p>Banyumas, Indonesia</p>
                    </div>
                </div>
                
                <div class="col-md-6" data-aos="fade-left">
                    <form id="contactForm" onsubmit="sendWhatsApp(event)">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pesan</label>
                            <textarea class="form-control" rows="5" id="message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-gold-action px-5 py-2">
                            Kirim Pesan
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </section>
